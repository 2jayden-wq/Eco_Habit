<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Habit | Eco Tracker</title>
    <link rel="stylesheet" href="css/create-habit.css">
</head>
<body>
    <main class="form-container">
        <header class="form-header">
            <button onclick="history.back()" class="back-btn">← Back</button>
            <h1 id="form-title">Create New Habit</h1>
        </header>

        <form id="habit-form">
            <div class="form-group">
                <label for="habit-name">Habit Name</label>
                <input type="text" id="habit-name" placeholder="e.g. Morning Yoga" required>
            </div>

            <div class="form-group">
                <label for="habit-frequency">Frequency</label>
                <select id="habit-frequency">
                    <option value="Daily">Daily</option>
                    <option value="Weekly">Weekly</option>
                    <option value="Monthly">Monthly</option>
                </select>
            </div>

            <div class="form-group">
                <label for="habit-goal">Goal (Times per day)</label>
                <input type="number" id="habit-goal" value="1" min="1">
            </div>

            <div class="form-group">
                <label for="habit-time">Reminder Time</label>
                <input type="time" id="habit-time" value="08:00">
            </div>

            <button type="submit" class="btn-save">Save Habit</button>
        </form>
    </main>
        <nav class="navbar">
            <a href="index.html">🏠<span>Home</span></a>
            <a href="library.html">📖<span>Library</span></a>
            <a href="manage-habits.html">⚙️<span>Manage</span></a>
            <a href="progress.html">📊<span>Stats</span></a>
            <a href="settings.html">👤<span>Settings</span></a>
        </nav>
    </footer>
  

    <script src="js/app.js"></script>
</body>
</html>
